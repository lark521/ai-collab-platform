<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoTracker - 轨迹查看</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
#app{display:flex;height:100vh}
#sidebar{width:340px;background:#1e293b;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;border-right:1px solid #334155}
#map{flex:1}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
h1 span{font-size:24px}
.card{background:#0f172a;border-radius:12px;padding:14px}
.card h3{font-size:13px;color:#94a3b8;margin-bottom:10px}
label{font-size:12px;color:#94a3b8;display:block;margin-bottom:4px}
input,select{width:100%;height:38px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;padding:0 10px;font-size:13px;outline:none}
input:focus,select:focus{border-color:#3b82f6}
.btn{width:100%;height:40px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-secondary{background:#475569;color:#e2e8f0}
.btn-secondary:hover{background:#374151}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626}
.row{display:flex;gap:8px}
.row>*{flex:1}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
.status .dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.status.off .dot{background:#ef4444}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{text-align:center;padding:8px;background:#1e293b;border-radius:8px}
.stat .val{font-size:20px;font-weight:700;color:#3b82f6}
.stat .lbl{font-size:11px;color:#64748b;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#1e293b;padding:8px;text-align:left;color:#94a3b8;font-weight:600}
td{padding:8px;border-bottom:1px solid #1e293b}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-live{background:#22c55e22;color:#22c55e}
.badge-archive{background:#f59e0b22;color:#f59e0b}
#mapDiv{width:100%;height:100%}
@media(max-width:768px){#sidebar{width:100%;height:auto;max-height:45vh}#app{flex-direction:column}#map{height:55vh}}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1><span>📍</span> GeoTracker 轨迹查看</h1>
    
    <div class="card">
      <h3>⚙️ 连接设置</h3>
      <label>服务器地址</label>
      <input id="serverUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
      <label style="margin-top:10px">设备 ID</label>
      <input id="deviceId" placeholder="输入设备ID">
      <div style="margin-top:10px" class="row">
        <button class="btn btn-primary" onclick="fetchTrajectory()">📡 加载轨迹</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-secondary" onclick="fetchDevices()">📱 列出设备</button>
      </div>
    </div>

    <div class="card">
      <h3>⏱ 时间窗口</h3>
      <select id="hours" onchange="autoLoad()">
        <option value="1">最近 1 小时</option>
        <option value="6">最近 6 小时</option>
        <option value="12">最近 12 小时</option>
        <option value="24" selected>最近 24 小时</option>
        <option value="48">最近 48 小时</option>
        <option value="168">最近一周</option>
        <option value="720">最近一个月</option>
      </select>
    </div>

    <div class="card">
      <h3>📊 统计</h3>
      <div id="stats">
        <div class="stat"><div class="val" id="statPoints">-</div><div class="lbl">轨迹点</div></div>
        <div class="stat"><div class="val" id="statDuration">-</div><div class="lbl">时间跨度</div></div>
        <div class="stat"><div class="val" id="statDevices">-</div><div class="lbl">设备数</div></div>
        <div class="stat"><div class="val" id="statArchives">-</div><div class="lbl">归档量</div></div>
      </div>
    </div>

    <div class="card">
      <h3>🏛 归档管理</h3>
      <div class="row">
        <button class="btn btn-secondary" onclick="runArchive()">📦 手动归档</button>
        <button class="btn btn-danger" onclick="showCleanup()">🗑 清理归档</button>
      </div>
      <div id="archiveSummary" style="margin-top:8px;font-size:12px;color:#94a3b8"></div>
    </div>

    <div class="card">
      <h3>📋 设备列表</h3>
      <div id="deviceList" style="font-size:12px;max-height:120px;overflow-y:auto"></div>
    </div>

    <div style="margin-top:auto">
      <div class="status" id="statusBar"><span class="dot"></span><span>就绪</span></div>
    </div>
  </div>
  <div id="mapDiv"></div>
</div>

<script>
let map, layerGroup;
const COLORS = ['#3b82f6','#ef4444','#22c55e','#f59e0b','#a855f7','#ec4899','#06b6d4','#f97316'];

function initMap() {
  map = L.map('mapDiv').setView([39.9, 116.4], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
  layerGroup = L.layerGroup().addTo(map);
}

function status(msg, ok=true) {
  const el = document.getElementById('statusBar');
  el.className = 'status' + (ok ? '' : ' off');
  el.innerHTML = '<span class="dot"></span><span>' + msg + '</span>';
}

async function getServer() {
  return document.getElementById('serverUrl').value.replace(/\/$/, '');
}

async function fetchDevices() {
  try {
    const srv = await getServer();
    const r = await fetch(srv + '/api/devices');
    const j = await r.json();
    const list = document.getElementById('deviceList');
    if (j.success && j.data.length) {
      let html = '<table><tr><th>设备ID</th><th>名称</th><th>最后在线</th></tr>';
      j.data.forEach(d => {
        const ago = Math.round((Date.now() - d.last_seen)/60000);
        html += '<tr><td>' + d.device_id.substring(0,16) + '...</td><td>' + (d.device_name||'-') + '</td><td>' + (ago < 60 ? ago + '分钟前' : ago/60|0 + '小时前') + '</td></tr>';
      });
      html += '</table>';
      list.innerHTML = html;
    } else {
      list.innerHTML = '<p style="color:#64748b">暂无设备</p>';
    }
    status('设备列表已加载');
  } catch(e) { status('获取设备列表失败: ' + e.message, false); }
}

async function fetchTrajectory() {
  const deviceId = document.getElementById('deviceId').value.trim();
  if (!deviceId) { status('请输入设备ID', false); return; }
  const hours = document.getElementById('hours').value;
  
  status('正在加载轨迹...');
  try {
    const srv = await getServer();
    const r = await fetch(srv + '/api/trajectory?deviceId=' + encodeURIComponent(deviceId) + '&hours=' + hours);
    const j = await r.json();
    
    if (j.success) {
      drawTrajectory(j.data);
      document.getElementById('statPoints').textContent = j.total;
      
      if (j.data.length >= 2) {
        const t1 = new Date(j.data[0].reported_at);
        const t2 = new Date(j.data[j.data.length-1].reported_at);
        const diff = (t2 - t1) / 60000;
        document.getElementById('statDuration').textContent = diff < 60 ? Math.round(diff) + '分钟' : (diff/60).toFixed(1) + '小时';
      }
      
      // Fetch stats
      const sr = await fetch(srv + '/api/stats');
      const sj = await sr.json();
      if (sj.success) {
        document.getElementById('statDevices').textContent = sj.data.devices;
        document.getElementById('statArchives').textContent = sj.data.archives;
      }
      
      status('已加载 ' + j.total + ' 个轨迹点');
    } else {
      status('加载失败: ' + (j.error||'未知错误'), false);
    }
  } catch(e) { status('请求失败: ' + e.message, false); }
}

function drawTrajectory(points) {
  layerGroup.clearLayers();
  
  if (!points.length) { status('该时段无数据'); return; }
  
  const markers = [];
  const paths = [];
  
  points.forEach((p, i) => {
    const color = COLORS[i % COLORS.length];
    const popup = '<b>点位 ' + (i+1) + '</b><br>' +
      '纬度: ' + p.latitude.toFixed(6) + '<br>' +
      '经度: ' + p.longitude.toFixed(6) + '<br>' +
      '精度: ' + (p.accuracy||'-') + '<br>' +
      '速度: ' + (p.speed||0) + ' km/h<br>' +
      '地址: ' + (p.address||'-') + '<br>' +
      '时间: ' + new Date(p.reported_at).toLocaleString('zh-CN');
    
    // Points
    markers.push(L.circleMarker([p.latitude, p.longitude], {
      radius: 4, fillColor: color, color: color, weight: 1, opacity: 1, fillOpacity: 0.8
    }).bindPopup(popup));
    
    // Path segments
    if (i < points.length - 1) {
      const next = points[i+1];
      paths.push(L.polyline([[p.latitude, p.longitude], [next.latitude, next.longitude]], {
        color: color, weight: 3, opacity: 0.7
      }));
    }
    
    // First & last markers
    if (i === 0) {
      markers.push(L.circleMarker([p.latitude, p.longitude], {
        radius: 8, fillColor: '#22c55e', color: '#fff', weight: 2, fillOpacity: 0.6
      }).bindPopup('<b>起点</b><br>' + new Date(p.reported_at).toLocaleString('zh-CN')));
    }
    if (i === points.length - 1) {
      markers.push(L.circleMarker([p.latitude, p.longitude], {
        radius: 8, fillColor: '#ef4444', color: '#fff', weight: 2, fillOpacity: 0.6
      }).bindPopup('<b>终点</b><br>' + new Date(p.reported_at).toLocaleString('zh-CN')));
    }
  });
  
  layerGroup.addLayers(markers);
  layerGroup.addLayers(paths);
  
  // Fit map to all points
  const bounds = L.latLngBounds(points.map(p => [p.latitude, p.longitude]));
  map.fitBounds(bounds, { padding: [40, 40] });
}

async function runArchive() {
  try {
    const srv = await getServer();
    const r = await fetch(srv + '/api/archive/run', { method: 'POST' });
    const j = await r.json();
    if (j.success) {
      status('已归档 ' + j.archived + ' 条记录');
    } else {
      status('归档失败', false);
    }
  } catch(e) { status('请求失败', false); }
}

function showCleanup() {
  const days = prompt('清理多少天之前的归档数据？(天)', '90');
  if (days) {
    const beforeMs = Date.now() - parseInt(days) * 86400000;
    const deviceId = document.getElementById('deviceId').value.trim();
    (async () => {
      try {
        const srv = await getServer();
        const r = await fetch(srv + '/api/archive/cleanup', {
          method: 'DELETE',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ deviceId, beforeMs })
        });
        const j = await r.json();
        status('已清理 ' + j.deleted + ' 条归档');
      } catch(e) { status('清理失败', false); }
    })();
  }
}

function autoLoad() {
  if (document.getElementById('deviceId').value) {
    fetchTrajectory();
  }
}

initMap();
</script>
</body>
</html>
